name: Build static bundle

"on":
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: build-static-bundle
  cancel-in-progress: false

jobs:
  build-static-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore static image cache
        uses: actions/cache@v4
        with:
          path: |
            static-worker/public/covers
            static-worker/public/lxns-icons
          key: static-images-${{ runner.os }}-${{ github.repository }}
          restore-keys: |
            static-images-${{ runner.os }}-${{ github.repository }}-

      - name: Generate static assets
        working-directory: backend
        env:
          MAIMAID_API_URL: ${{ secrets.MAIMAID_API_URL }}
          MAIMAID_INTERNAL_JOB_TOKEN: ${{ secrets.MAIMAID_INTERNAL_JOB_TOKEN }}
          MAIMAID_STATIC_ASSETS_URL: ${{ secrets.MAIMAID_STATIC_ASSETS_URL }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          : "${MAIMAID_API_URL:?Missing GitHub Secret MAIMAID_API_URL}"
          : "${MAIMAID_INTERNAL_JOB_TOKEN:?Missing GitHub Secret MAIMAID_INTERNAL_JOB_TOKEN}"
          : "${MAIMAID_STATIC_ASSETS_URL:?Missing GitHub Secret MAIMAID_STATIC_ASSETS_URL}"
          pnpm run static-bundle:build

      - name: Save static image cache
        uses: actions/cache/save@v4
        with:
          path: |
            static-worker/public/covers
            static-worker/public/lxns-icons
          key: static-images-${{ runner.os }}-${{ github.repository }}-${{ github.run_id }}

      - name: Deploy static assets Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing GitHub Secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing GitHub Secret CLOUDFLARE_ACCOUNT_ID}"
          pnpm exec wrangler deploy --config ../static-worker/wrangler.jsonc

      - name: Verify and notify API
        working-directory: backend
        env:
          MAIMAID_API_URL: ${{ secrets.MAIMAID_API_URL }}
          MAIMAID_INTERNAL_JOB_TOKEN: ${{ secrets.MAIMAID_INTERNAL_JOB_TOKEN }}
          MAIMAID_STATIC_ASSETS_URL: ${{ secrets.MAIMAID_STATIC_ASSETS_URL }}
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-all-errors "${MAIMAID_STATIC_ASSETS_URL%/}/manifest.json" -o /tmp/maimaid-manifest.json
          node -e 'const fs=require("fs"); const local=JSON.parse(fs.readFileSync("../static-worker/public/manifest.json")); const remote=JSON.parse(fs.readFileSync("/tmp/maimaid-manifest.json")); if (local.version !== remote.version || local.md5 !== remote.md5) process.exit(1)'
          pnpm run static-bundle:build -- --notify >/dev/null 2>&1 || true
