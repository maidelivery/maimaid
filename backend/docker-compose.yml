name: maimaid-local

services:
  postgres:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_DB: maimaid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=maimaid
    ports:
      # Loopback-only on purpose. Publishing a port makes Docker write its own
      # iptables rules ahead of the host firewall, so a bare "54329:5432" on a
      # public host exposes Postgres to the internet with the default credentials
      # above and ufw will not stop it. The backend reaches Postgres over the
      # compose network, not this mapping; it exists only for local psql/Studio.
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maimaid"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Object storage is Cloudflare R2, so there is no storage container here. Point
  # the S3_* vars in .env.docker at the private avatar and public static-bundle
  # buckets, or leave them blank to run without object storage.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.docker
        required: true
      - path: .env.docker.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Also loopback-only: on a server this sits behind a TLS reverse proxy, and
      # the app must not be reachable on http://<public-ip>:8787 alongside it.
      - "127.0.0.1:8787:8787"
    restart: unless-stopped

volumes:
  postgres-data:
