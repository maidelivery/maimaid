name: maimaid-local

services:
  postgres:
    build:
      context: ./docker/postgres
    environment:
      POSTGRES_DB: maimaid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=maimaid
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maimaid"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage is Cloudflare R2, so there is no storage container here. Point
  # the S3_* vars in .env.docker at an R2 bucket, or leave them blank to run
  # without object storage (avatar upload then returns storage_not_configured).
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.docker
        required: true
      - path: .env.docker.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    restart: unless-stopped

volumes:
  postgres-data:
